name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk ART-MR.apk
      - run: gh release delete v1 -y --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release create v1 ART-MR.apk -t ART-MR -n "APK ART-MR (32/64 bits)"
        env:
          GH_TOKEN: ${{ github.token }}
